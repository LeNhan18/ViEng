name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      RAG_ENABLED: "false"
      OCR_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.lite.txt
            requirements-dev.txt
      # Cài đúng bộ deps của Docker image mặc định (lite) để bắt lỗi import/khởi động.
      - name: Install backend deps (lite = Docker default)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lite.txt -r requirements-dev.txt
      - name: Smoke - app imports
        run: python -c "import app.main"
      - name: Run tests (API, structured outputs, eval harness)
        run: pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        run: npm ci
      - name: Build
        run: npm run build
