apiVersion: apps/v1
kind: Deployment
metadata:
  name: vieng-backend
  namespace: vieng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vieng-backend
  template:
    metadata:
      labels:
        app: vieng-backend
    spec:
      containers:
        - name: backend
          # GHCR chỉ chấp nhận tên viết thường (docker.yml đẩy ghcr.io/lenhan18/vieng-backend)
          image: ghcr.io/lenhan18/vieng-backend:main
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_ENV
              value: "production"
            - name: APP_HOST
              value: "0.0.0.0"
            - name: APP_PORT
              value: "8000"
            - name: LOG_LEVEL
              value: "info"
            # Inject secrets qua Secret (tự tạo):
            # kubectl -n vieng create secret generic vieng-secrets --from-literal=ANTHROPIC_API_KEY=...
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vieng-secrets
                  key: ANTHROPIC_API_KEY
                  optional: true
            - name: ANTHROPIC_MODEL
              value: "claude-haiku-5-5"
            - name: TYPESAFE_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vieng-secrets
                  key: TYPESAFE_API_KEY
                  optional: true
            - name: OPENROUTER_API_KEY
              valueFrom:
                secretKeyRef:
                  name: vieng-secrets
                  key: OPENROUTER_API_KEY
                  optional: true
            - name: USE_FINETUNED_MODEL
              valueFrom:
                secretKeyRef:
                  name: vieng-secrets
                  key: USE_FINETUNED_MODEL
                  optional: true
            - name: HF_MODEL_NAME
              valueFrom:
                secretKeyRef:
                  name: vieng-secrets
                  key: HF_MODEL_NAME
                  optional: true
            - name: ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: vieng-secrets
                  key: ADMIN_TOKEN
                  optional: true
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "2"
              memory: "3Gi"
          # Lần khởi động đầu có thể phải tải model/index: cho tối đa 5 phút trước khi liveness kiểm tra.
          startupProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 8000
            periodSeconds: 20
          volumeMounts:
            - name: vectorstore
              mountPath: /app/data/vectorstore
      volumes:
        # PVC: vectorstore không mất khi pod restart -> không phải index lại mỗi lần khởi động
        - name: vectorstore
          persistentVolumeClaim:
            claimName: vieng-vectorstore
